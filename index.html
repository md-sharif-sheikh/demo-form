<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <sectioin class="form-section">
        <div class="container">
            <div class="card">
                <div class="left">
                    <img src="img/office work.jpg" alt="" width="120px">
                </div>
                <div class="right">
                    <form >
                        <div class="name">
                            <input type="text" placeholder="First name">
                            <input type="text" placeholder="Last name">
                        </div>
                        <div class="email">
                            <input type="email" placeholder="enter your email">
                        </div>
                        <div class="password">
                            <input type="password" placeholder="enter a strong password">
                        </div>
                        <div class="dob">
                            <input type="date">
                        </div>
                        <div class="gender">
                            <select>
                                <option>select your gender</option>
                                <option>male</option>
                                <option>female</option>
                                <option>others</option>
                            </select>
                        </div>
                        <div class="condition">
                            <input type="checkbox">
                            <span>i agree with this condition</span>
                        </div>
                        <div class="submit">
                            <input type="submit" value="submit">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </sectioin>
    
</body>
</html>
